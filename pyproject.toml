[build-system]
requires = ["hatchling>=1.24"]
build-backend = "hatchling.build"

[project]
name = "pdf2epub"
version = "0.1.0"
description = "Convert PDFs (especially scientific papers) into reflowable, Kindle-friendly EPUBs that keep formulas, figures and tables pixel-faithful."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "mgbvox" }]
keywords = ["pdf", "epub", "kindle", "ebook", "converter", "latex", "math"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Environment :: Console",
    "Topic :: Text Processing :: Markup :: HTML",
    "Topic :: Utilities",
]
dependencies = [
    "pymupdf>=1.24",
    "pillow>=10",
    "numpy>=1.24",
    "typer>=0.12",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
pdf2epub = "pdf2epub.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pdf2epub"]

[tool.pytest.ini_options]
testpaths = ["tests"]
